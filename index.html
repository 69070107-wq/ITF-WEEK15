<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile Card</title>
  <!-- Lab 14: แยกไฟล์ CSS ออกจาก HTML เพื่อให้จัดการง่ายขึ้น -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="profile">
      <img src="ไร้สาระ.jpg" alt="รูปโปรไฟล์">
      <h1>ปณิธาน อุทัยแพน</h1>
      <p><strong>รหัสนักศึกษา:</strong> 69070107<br>
         <strong>สาขา:</strong> เทคโนโลยีสารสนเทศ (IT)</p>
      <p>สวัสดีครับ สนใจเรียนรู้ทักษะใหม่ ๆ และพัฒนาตัวเอง</p>
      <p><strong>ช่องทางติดต่อ</strong><br>
        <a href="https://www.instagram.com/_w4lnxtt/" target="_blank">instagram</a>
      </p>
    </div>
    <div class="todo">
      <h2>To-do List</h2>
      <div class="input-row">
        <input id="todo-input" type="text" placeholder="พิมพ์สิ่งที่ต้องทำ...">
        <button id="add-btn" type="button">เพิ่ม</button>
      </div>
      <!-- รายการงานจะถูกสร้างด้วย JavaScript จากข้อมูลใน Local Storage -->
      <ul id="todo-list"></ul>
      <p class="note" id="status-msg" role="status"></p>
      <p class="note" id="empty-msg" hidden>ยังไม่มีรายการ — พิมพ์งานที่ต้องทำด้านบนแล้วกดปุ่ม "เพิ่ม"</p>
    </div>
  </div>

  <!-- Lab 14: เชื่อมไฟล์ JavaScript เข้ากับหน้าเว็บ (วางไว้ท้าย body เพื่อให้ DOM พร้อมก่อน) -->
  <script src="script.js"></script>
</body>
</html>
